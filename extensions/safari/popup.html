<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>NeuroReader</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="pp-header">
      <h1 class="pp-logo">NeuroReader</h1>
      <p class="pp-tagline">Transform text locally. Only settings can sync through your browser profile.</p>
    </header>

    <label class="pp-toggle">
      <input type="checkbox" id="auto-toggle" />
      <span>Auto-transform every page</span>
    </label>

    <button id="nr-settings-toggle" class="pp-settings-toggle" type="button" aria-expanded="false" aria-controls="nr-settings">⚙ Settings</button>
    <section id="nr-settings" class="pp-settings" hidden aria-label="Reading settings">
      <fieldset><legend>Visual style</legend>
        <label class="pp-toggle pp-sub"><input type="checkbox" data-setting="gradient" /><span>Gradient fixation<small>Fade color across fixation letters.</small></span></label>
        <label class="pp-toggle pp-sub"><input type="checkbox" data-setting="complexity" /><span>Word complexity<small>Red, blue, green, and rainbow word cues.</small></span></label>
        <label class="pp-toggle pp-sub"><input type="checkbox" data-setting="rainbowWords" /><span>Rainbow words<small>Give each word a rotating rainbow fixation color.</small></span></label>
        <label class="pp-toggle pp-sub"><input type="checkbox" data-setting="sentence" /><span>Sentence position<small>Green starts and blue sentence endings.</small></span></label>
        <label class="pp-toggle pp-sub"><input type="checkbox" data-setting="contrast" /><span>High contrast<small>Pure black and white reading.</small></span></label>
      </fieldset>
      <fieldset><legend>Reading aids</legend>
        <label class="pp-toggle pp-sub"><input type="checkbox" data-setting="progress" /><span>Read-progress fading<small>Soften content above your position.</small></span></label>
        <label class="pp-toggle pp-sub"><input type="checkbox" data-setting="spotlight" /><span>Focus spotlight<small>Dim content outside the current block.</small></span></label>
        <label class="pp-toggle pp-sub"><input type="checkbox" data-setting="ruler" /><span>Reading ruler<small>Follow your pointer, or hold Alt and use arrow keys.</small></span></label>
        <label class="pp-range pp-sub" for="nr-ruler-size"><span>Ruler band<small>Choose how many lines stay clear.</small></span><input id="nr-ruler-size" type="range" min="2" max="14" step="1" value="6" data-setting="rulerSize" /></label>
        <label class="pp-range pp-sub" for="nr-ruler-dim"><span>Outside dimming<small>Set how strongly the rest of the page fades.</small></span><input id="nr-ruler-dim" type="range" min="0" max="70" step="1" value="28" data-setting="rulerDim" /></label>
        <label class="pp-range pp-sub" for="nr-ruler-step"><span>Keyboard movement<small>Choose how far Alt + Arrow moves the ruler.</small></span><input id="nr-ruler-step" type="range" min="2" max="20" step="1" value="8" data-setting="rulerStep" /></label>
        <label class="pp-toggle pp-sub"><input type="checkbox" data-setting="rulerLock" /><span>Lock ruler to keyboard<small>Ignore pointer movement until you turn this off.</small></span></label>
        <label class="pp-toggle pp-sub"><input type="checkbox" data-setting="motion" /><span>Motion reduction<small>Remove visual transitions.</small></span></label>
        <label class="pp-toggle pp-sub"><input type="checkbox" data-setting="spacing" /><span>Reading spacing<small>Use calmer line, letter, and word spacing.</small></span></label>
        <label class="pp-range pp-sub" for="nr-line-height"><span>Line height<small>Set the distance between lines.</small></span><input id="nr-line-height" type="range" min="1" max="2.2" step="0.1" value="1.5" data-setting="lineHeight" /></label>
        <label class="pp-range pp-sub" for="nr-letter-spacing"><span>Letter spacing<small>Open letters slightly without changing text.</small></span><input id="nr-letter-spacing" type="range" min="0" max="0.2" step="0.01" value="0.03" data-setting="letterSpacing" /></label>
        <label class="pp-range pp-sub" for="nr-word-spacing"><span>Word spacing<small>Separate words gently for easier tracking.</small></span><input id="nr-word-spacing" type="range" min="0" max="0.8" step="0.05" value="0.2" data-setting="wordSpacing" /></label>
        <label class="pp-range pp-sub" for="nr-text-scale"><span>Text size<small>Make readable text smaller or larger without changing its words.</small></span><input id="nr-text-scale" type="range" min="0.85" max="1.5" step="0.05" value="1" data-setting="textScale" /></label>
      </fieldset>
      <fieldset><legend>Focus tools</legend>
        <label class="pp-toggle pp-sub"><input type="checkbox" id="nr-focus-setting" /><span>Focus tools<small>Keep reading mode calm and focused.</small></span></label>
        <label class="pp-toggle pp-sub"><input type="checkbox" id="nr-blue-light-setting" /><span>Blue light filter<small>Warm the page during your evening window.</small></span></label>
        <label class="pp-toggle pp-sub"><input type="checkbox" id="nr-eye-rest-setting" /><span>Eye-rest reminders<small>Gentle 20-minute reminders; never interrupts the page.</small></span></label>
        <button id="nr-reading-mode" class="pp-btn pp-secondary" type="button">Enter reading mode</button>
      </fieldset>
    </section>

    <fieldset class="pp-color">
      <legend>Fixation color</legend>
      <div class="pp-color-row">
        <input id="nr-color" type="color" value="#dc2626" aria-label="Choose fixation color" />
        <div class="pp-swatches" aria-label="Preset fixation colors">
          <button type="button" class="pp-swatch" data-color="#dc2626" style="--swatch: #dc2626" aria-label="Red"></button>
          <button type="button" class="pp-swatch" data-color="#2563eb" style="--swatch: #2563eb" aria-label="Blue"></button>
          <button type="button" class="pp-swatch" data-color="#ca8a04" style="--swatch: #ca8a04" aria-label="Yellow"></button>
          <button type="button" class="pp-swatch" data-color="#ea580c" style="--swatch: #ea580c" aria-label="Orange"></button>
          <button type="button" class="pp-swatch" data-color="#16a34a" style="--swatch: #16a34a" aria-label="Green"></button>
          <button type="button" class="pp-swatch" data-color="#9333ea" style="--swatch: #9333ea" aria-label="Purple"></button>
        </div>
      </div>
      <p class="pp-color-help">Choose a preset or any color. It updates open pages instantly.</p>
    </fieldset>

    <label class="visually-hidden" for="pp-input">Text to transform</label>
    <textarea
      id="pp-input"
      placeholder="Paste your text here..."
      spellcheck="false"
      autocomplete="off"
      autocapitalize="off"
      autocorrect="off"
    ></textarea>
    <button id="pp-transform" class="pp-btn pp-primary" type="button">
      Transform
    </button>

    <div id="pp-output" class="pp-output" hidden></div>

    <div class="pp-row">
      <button id="pp-copy" class="pp-btn pp-secondary" type="button" disabled>
        Copy
      </button>
      <button id="pp-page" class="pp-btn pp-secondary" type="button">
        Transform this page
      </button>
    </div>

    <p id="pp-status" class="pp-status" role="status"></p>

    <p class="pp-foot">
      Free. Always. Built for neurodivergent brains.
    </p>

    <script src="formula.js"></script>
    <script src="features.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
