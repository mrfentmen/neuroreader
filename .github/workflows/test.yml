name: Test

# Runs on every push to any branch and every PR:
#   - test:          the 22 formula assertions against the shipped formula.min.js
#   - firefox-extension: MV2 addon lint + real install/launch (test/firefox.e2e.js)
#   - firefox-dom:   DOM-level e2e of the shipped content script inside real
#                    Firefox (test/firefox-dom.e2e.js)
#   - adaptive-pages: local adaptive engine, dashboard, formula builder, and PWA checks
#   - chrome:        unpacked Chrome extension, hardpage, and web-app e2e
#                    (test/extension.e2e.js, test/hardpage.e2e.js,
#                     test/webapp.e2e.js)
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No npm install needed for `npm test`: it loads the committed
      # formula.min.js (the exact file index.html ships) into Node and runs
      # the assertions against it. If the minified formula is ever broken,
      # CI fails.
      - name: Run formula unit tests
        run: npm test

  adaptive-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run local adaptive and companion-page tests
        run: npm run test:adaptive-pages
      - name: Verify Safari dropdown-control parity
        run: npm run test:safari-controls
      - name: Run Phase 2 reading-mode regression
        run: npm run test:phase2-reading-mode
      - name: Run Phase 3 helper regression
        run: npm run test:phase3
      - name: Run Phase 3 Firefox parity regression
        run: npm run test:phase3-firefox
      - name: Run Phase 4 local progress regression
        run: npm run test:phase4-stats
      - name: Run Phase 5 saved-reading regression
        run: npm run test:phase5-library

  firefox-extension:
    # Proves the Firefox (MV2) build stays lint-clean and installs correctly:
    # byte-parity of shared runtime files, web-ext lint (Mozilla's own
    # validator), and a real temporary-addon install + launch via web-ext run
    # against Playwright's Firefox, all driven by test/firefox.e2e.js.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Firefox
        # --with-deps installs Firefox's system library requirements on the
        # runner; the suite fails fast with a clear message if it's missing.
        run: npx playwright install --with-deps firefox
      - name: Run Firefox (MV2) extension e2e
        # web-ext run launches a real Firefox window to install the addon;
        # xvfb provides the display on the headless runner.
        run: xvfb-run -a npm run test:firefox

  firefox-dom:
    # DOM-level e2e of the shipped formula.js + content.js inside real
    # Firefox (Playwright's bundled Juggler build) with a small
    # chrome.storage/runtime stub, driving the hardpage fixture: auto-
    # transform on load, sticky late/recycled content, characterData
    # rewrites, shadow roots, adaptive bolding, launcher undo. The suite
    # launches Firefox headed, so xvfb provides the display; it also needs
    # the fixture server on :8111.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Firefox
        # --with-deps installs Firefox's system library requirements on the
        # runner.
        run: npx playwright install --with-deps firefox
      - name: Run Firefox DOM e2e
        # The suite expects the repo to be served on :8111 and launches a
        # headed Firefox — start the server in the same step so it stays
        # alive for the run, then clean up; xvfb supplies the display.
        run: |
          python3 -m http.server 8111 --bind 127.0.0.1 >/dev/null 2>&1 &
          sleep 2
          xvfb-run -a npm run test:firefox-dom
          status=$?
          kill %1 2>/dev/null
          exit $status

  chrome:
    # Runs both Chromium browser suites against the unpacked MV3 addon:
    # the real extension flow and the hardpage fixture covering sticky
    # transforms, characterData rewrites, shadow roots, adaptive bolding,
    # and undo. Chromium needs a headed window for extension loading, so
    # xvfb supplies the display on the headless runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Run Chrome extension and hardpage e2e
        # Both suites expect the repo served on :8111. Keep the server alive
        # for both commands and always clean it up, including on failure.
        run: |
          python3 -m http.server 8111 --bind 127.0.0.1 >/dev/null 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --show-error --retry 15 --retry-delay 1 --retry-connrefused \
            http://127.0.0.1:8111/index.html >/dev/null
          xvfb-run -a npm run test:e2e
          xvfb-run -a node test/hardpage.e2e.js
          xvfb-run -a npm run test:webapp
          xvfb-run -a npm run test:phase3-popup
          xvfb-run -a npm run test:phase5-popup
