name: Test

# Runs the 22 formula assertions on every push to any branch and every PR.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No npm install needed for `npm test`: it loads the committed
      # formula.min.js (the exact file index.html ships) into Node and runs
      # the assertions against it. If the minified formula is ever broken,
      # CI fails.
      - name: Run formula unit tests
        run: npm test
