name: Test

# Runs the 21 formula assertions on every push to any branch and every PR.
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # No npm install needed: the project has zero dependencies, and the
      # test harness evaluates the formula straight out of index.html.
      - name: Run formula unit tests
        run: npm test
