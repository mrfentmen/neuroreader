name: Release Chrome extension

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release-chrome:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify tag matches Chrome manifest
        run: npm run check:release-version -- "${GITHUB_REF_NAME}"
      - name: Validate Chrome release metadata
        run: npm run validate:chrome-release && npm run test:validate-chrome-release
      - name: Run formula and release integrity tests
        run: npm test && npm run test:package-chrome && npm run test:ci-hardening
      - name: Run packaged Chrome artifact e2e
        run: npx playwright install --with-deps chromium && xvfb-run -a npm run test:package-chrome-e2e
      - name: Build Chrome release ZIP
        run: npm run package:chrome
      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          files: dist/neuroreader-chrome-v*.zip
          body: |
            Chrome public-beta release for NeuroReader.

            Install the ZIP through the Chrome Web Store when the listing is available for automatic future updates. For local testing, unzip it and load the generated staging directory through Chrome Extensions > Developer mode > Load unpacked.

            The browser extension processes text locally. See STORE-LISTING.md and privacy.html for the privacy boundary and known site limitations.
